<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albums & Tracks | Adhi Sasongko</title>
  <link rel="icon" type="image/png" href="images/Untitled39_20261108173618.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container navbar">
      <a href="index.html" class="brand">ADHI SASONGKO</a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Buka menu" aria-expanded="false">☰</button>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Beranda</a>
        <a href="profil.html" class="nav-link">Profil</a>
        <a href="projects.html" class="nav-link">Proyek</a>
        <a href="gallery.html" class="nav-link">Galeri</a>
        <a href="albums.html" class="nav-link aktif">Albums</a>
        <a href="admin.html" class="nav-link nav-link-admin">Admin</a>
      </nav>
    </div>
  </header>

  <main class="container page-wrap">
    <p class="eyebrow">04 / MUSIC</p>
    <h1 class="serif-title page-title">Albums & <span class="accent-text">Tracks.</span></h1>
    <p class="lead">Daftar album dan lagu pilihan yang sedang sering diputar.</p>

    <section class="album-grid" id="albumGrid"></section>

    <h2 class="sub-judul">Top Tracks</h2>
    <section class="track-list" id="trackList"></section>

    <a href="index.html" class="btn btn-outline">← Kembali ke Beranda</a>
  </main>

  <footer class="site-footer">
    <div class="container">
      © 2026 Adhi Sasongko · Dewan Ambalan · SMK Tamtama 1 Sidareja
    </div>
  </footer>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mJudul">
    <div class="modal-isi">
      <button class="modal-tutup" id="mTutup" aria-label="Tutup">✕</button>
      <img class="modal-cover" id="mCover" src="" alt="">
      <h2 id="mJudul"></h2>
      <p class="modal-artist" id="mArtist"></p>
      <p class="modal-deskripsi" id="mDeskripsi"></p>
      <div id="mTrackWrap">
        <h3>Tracklist</h3>
        <ol class="tracklist" id="mTracks"></ol>
      </div>
      <a class="btn btn-spotify" id="mSpotify" href="#" target="_blank" rel="noopener">Dengarkan di Spotify</a>
    </div>
  </div>

  <script type="module">
    import { initNavbar } from "./js/ui.js";
    import { getAlbums, getTracks, normalizeAlbumTracks } from "./js/data-service.js";

    initNavbar();

    const albums = await getAlbums();
    const topTracks = await getTracks();
    const grid = document.getElementById("albumGrid");
    const daftarTrack = document.getElementById("trackList");
    const modal = document.getElementById("modal");
    let terakhirFokus = null;

    function renderStars(rating) {
      const r = Math.max(0, Math.min(5, Math.round(Number(rating) || 0)));
      return r === 0 ? "" : "★".repeat(r) + "☆".repeat(5 - r);
    }

    function buatItem(data, kelas, kelasInfo, panah) {
      const tombol = document.createElement("button");
      tombol.className = kelas;
      tombol.type = "button";
      const img = document.createElement("img");
      img.src = data.cover || data.coverUrl || "imgalbm/97a5aa24de7948fc9135016f9980cfed.jpg";
      img.alt = `Cover ${data.judul || data.title || "album"}`;
      img.loading = "lazy";
      const info = document.createElement("div");
      info.className = kelasInfo;
      const strong = document.createElement("strong");
      strong.textContent = data.judul || data.title || "Untitled";
      const artist = document.createElement("span");
      artist.textContent = data.artist || "Unknown Artist";
      info.append(strong, artist);
      tombol.append(img, info);
      if (panah) {
        const arrow = document.createElement("span");
        arrow.className = "track-panah";
        arrow.setAttribute("aria-hidden", "true");
        arrow.textContent = "›";
        tombol.appendChild(arrow);
      }
      if (!panah && (data.edition || data.releaseDate)) {
        const badge = document.createElement("small");
        badge.className = "album-edition-tag";
        badge.textContent = data.edition ? data.edition.split("·")[0].trim() : data.releaseDate;
        info.appendChild(badge);
      }
      tombol.addEventListener("click", () => buka(data, tombol));
      return tombol;
    }

    albums.forEach(a => grid.appendChild(buatItem(a, "album-item", "album-info", false)));
    topTracks.forEach(t => daftarTrack.appendChild(buatItem(t, "track-item", "track-info", true)));

    function buka(a, pemicu) {
      terakhirFokus = pemicu;
      const cover = a.cover || a.coverUrl || "imgalbm/97a5aa24de7948fc9135016f9980cfed.jpg";
      document.getElementById("mCover").src = cover;
      document.getElementById("mCover").alt = `Cover ${a.judul || a.title || "album"}`;
      document.getElementById("mJudul").textContent = a.judul || a.title || "Untitled";
      document.getElementById("mArtist").textContent = a.artist || "Unknown Artist";
      document.getElementById("mDeskripsi").textContent = a.deskripsi || a.description || "";

      const spotifyBtn = document.getElementById("mSpotify");
      if (a.spotify && a.spotify !== "#") {
        spotifyBtn.style.display = "inline-flex";
        spotifyBtn.href = a.spotify;
      } else {
        spotifyBtn.style.display = "none";
      }

      let metaBox = document.getElementById("mMetaPills");
      if (!metaBox) {
        metaBox = document.createElement("div");
        metaBox.id = "mMetaPills";
        metaBox.className = "modal-meta-pills";
        document.getElementById("mArtist").insertAdjacentElement("afterend", metaBox);
      }
      metaBox.replaceChildren();
      [a.edition, a.releaseDate, a.countryFormat, a.rating ? `Album ★ ${a.rating}/5` : ""].filter(Boolean).forEach(text => {
        const pill = document.createElement("span");
        pill.className = "pill";
        pill.textContent = text;
        metaBox.appendChild(pill);
      });

      const ol = document.getElementById("mTracks");
      ol.className = "tracklist-detailed";
      ol.replaceChildren();
      const normalizedTracks = normalizeAlbumTracks(a.tracks);
      document.getElementById("mTrackWrap").style.display = normalizedTracks.length ? "" : "none";

      normalizedTracks.forEach((track, idx) => {
        const li = document.createElement("li");
        const left = document.createElement("div");
        left.className = "t-left";
        const num = document.createElement("span");
        num.className = "t-num";
        num.textContent = `${idx + 1}.`;
        const title = document.createElement("span");
        title.className = "t-title";
        title.textContent = track.title;
        left.append(num, title);

        const right = document.createElement("div");
        right.className = "t-right";
        if (track.rating > 0) {
          const stars = document.createElement("span");
          stars.className = "t-stars";
          stars.textContent = renderStars(track.rating);
          stars.setAttribute("aria-label", `Rating pribadi ${track.rating} dari 5`);
          right.appendChild(stars);
        }
        if (track.duration) {
          const duration = document.createElement("span");
          duration.textContent = track.duration;
          right.appendChild(duration);
        }
        li.append(left, right);
        ol.appendChild(li);
      });

      modal.classList.add("tampil");
      document.body.style.overflow = "hidden";
      document.getElementById("mTutup").focus();
    }

    function tutup() {
      modal.classList.remove("tampil");
      document.body.style.overflow = "";
      if (terakhirFokus) terakhirFokus.focus();
    }

    document.getElementById("mTutup").addEventListener("click", tutup);
    modal.addEventListener("click", e => { if (e.target === modal) tutup(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") tutup(); });
  </script>
</body>
</html>
